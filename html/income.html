<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>INCOME</title>
  <link rel="stylesheet" href="../css/style_income.css">
</head>
<body>
  <h1 id="income">INCOME $</h1>
<!--   <img class="ImageAccueil" src="Images/MoneyScale.png" alt="Money Time Scale"> -->
       <div id="accueil"> <button id="btnAccueil">ACCUEIL</button></div>
<div class="selecteur-mois">
    <label for="moisAnnee">Mois & Année :</label>
    <input type="month" id="moisAnnee" name="moisAnnee">
  </div>
  <div class="new-income">
    <h1 id="new-income-title">New income</h1>
    <form id="add-new-income"  action="" method="post">


        <label for="income">Add Amount</label>
        <input type="number" id="new-income" required>

        <label for="label">Add Label</label>
        <input type="text" id="label-new-income" required>

        <label for="description">Add Description</label>
        <input type="text" id="description-new-income" required>
        <input type="submit" value="Send">
    </form>
  </div>
  <div>
    <table id="incomeTable">
        <thead>
          <tr>
            <th>Income</th>
            <th>Amount</th>
            <th>Description</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
  </div>
  <div id="pagination"></div>
  <div class="new-suggestion">
    <h1 id="new-suggestion-title">New suggestion</h1>
    <form id="add-new-suggestion" action="" method="post">

        <label for="suggestion">Add new suggestion</label>
        <input type="text" id="new-suggestion" required>
        <textarea  id="content-new-suggestion" required></textarea>
        <br>
        <input type="submit" value="Send">
    </form>
  </div>
  <div>
    <table id = "suggestion-table">
        <thead>
          <tr>
            <th>Suggestion</th>
            <th>Content</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
         
        </tbody>
      </table>
  </div>
  <div id="pagination-suggestion">
  </div>


  <script src="/js/script_income.js"></script>
</body>
</html>
