<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Subscription</title>
  <link rel="stylesheet" href="../css/style_subscription.css">
</head>
<body>
  <div class="selecteur-mois">
    <label for="moisAnnee">Mois & Année :</label>
    <input type="month" id="moisAnnee" name="moisAnnee">
  </div>
  <div class="new-subscription">
    <h1 id="new-subscription-title">New Subscription</h1>
    <form id="add-new-subscription" action="" method="post">


        <label for="subscription">Add Amount</label>
        <input type="number" id="new-subscription" required>

        <label for="label">Add Label</label>
        <input type="text" id="label-new-subscription" required>

         <label for="description">Add Description</label>
        <input type="text" id="description-new-subscription" required>

        <input type="submit" value="Send">
    </form>
  </div>
  <div>
    <table id="subscriptionTable">
        <thead>
          <tr>
            <th>Subscription</th>
            <th>Amount</th>
            <th>Description</th>
            <th>Start_Date</th>
            <th>End_Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
  </div>
  <div id="pagination"></div>
  <div id="SumSubscription">
    <h2>Total Subscriptions: <span id="totalAmount">0</span></h2>
  </div>
  <script src="../js/script_subscription.js"></script>
</body>
</html>
